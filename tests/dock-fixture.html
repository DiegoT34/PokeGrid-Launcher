  <aside class="ah-panel" aria-label="Auto-Helper">
    <button class="ah-head" type="button">AUTO-HELPER</button>
  </aside>
  <section class="auto-helper-dialog" role="dialog" aria-label="Auto-Helper configuration" hidden>
    <header><h2>AUTO-HELPER</h2><button class="ah-close" type="button">Close</button></header>
    <div class="auto-cards">
      <article><h3>Auto-Potion</h3><label>Potion <select><option>Automatic (best)</option></select></label><label>Heal when HP <input type="number" value="40"></label></article>
      <article><h3>Auto-Revive</h3><label><input type="checkbox"> Uses Revive when fainted</label></article>
      <article><h3>Auto-Catch</h3><label>Pokéball <select><option>Ultra Ball</option></select></label><button type="button" aria-pressed="true">600</button><button type="button" aria-pressed="false">400</button></article>
      <article><h3>Auto-Catch Shiny</h3><label>Pokéball shiny <select><option>Master Ball</option></select></label><button type="button" aria-pressed="false">300</button><button type="button" aria-pressed="true">5</button></article>
    </div>
    <article><h3>Names (comma-separated)</h3><input placeholder="charizard, gyarados, pikachu"></article>
    <button type="button">Guardar configuración</button>
  </section>
