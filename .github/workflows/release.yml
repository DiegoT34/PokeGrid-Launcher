name: Publicar launcher portátil

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validar versión de la etiqueta
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con package.json ($version)."
          }

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar código y actualizador
        run: |
          pnpm check
          pnpm test:updater
          pnpm test:script-shop
          pnpm test:script-shop-live

      # OJO: `dist:zip`, no `dist`.
      #
      # Desde la 0.33.0 el script `dist` es `electron-builder --win dir`: produce `win-unpacked` y la
      # carpeta portatil, y NO produce ningun ZIP. Este flujo, en cambio, busca
      # `dist/IDLE-POKE-LAUNCHER-<version>-portatil.zip` en el paso siguiente para publicarlo como
      # adjunto de la release.
      #
      # Con `dist` ese paso fallaba con «No se genero ...-portatil.zip», la release no llegaba a
      # crearse NUNCA y no habia ninguna pista: la etiqueta ya se habia subido y el publicador ya
      # habia escrito «PUBLICACION_ENVIADA». Cuatro versiones seguidas (0.33.1, 0.35.1, 0.35.2 y
      # 0.36.1) tienen etiqueta en GitHub y ninguna release. El actualizador del launcher lee
      # `releases/latest`, asi que se quedaba en 0.27.0 para siempre sin decir nada.
      - name: Construir ZIP portátil
        run: pnpm dist:zip

      - name: Crear firma SHA-256
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "dist/IDLE-POKE-LAUNCHER-$version-portatil.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "No se generó $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -NoNewline
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}

      - name: Conservar las cinco releases más recientes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease | ConvertFrom-Json
          $sobran = $releases |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
            Sort-Object { [datetime]$_.publishedAt } -Descending |
            Select-Object -Skip 5
          foreach ($release in $sobran) {
            Write-Host "Quitando la release $($release.tagName); la etiqueta se conserva."
            gh release delete $release.tagName --yes
          }
