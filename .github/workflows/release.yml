name: Publicar launcher portátil

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validar versión de la etiqueta
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con package.json ($version)."
          }

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar código y actualizador
        run: |
          pnpm check
          pnpm test:updater

      - name: Construir ZIP portátil
        run: pnpm dist

      - name: Crear firma SHA-256
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "dist/IDLE-POKE-LAUNCHER-$version-portatil.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "No se generó $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -NoNewline
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
